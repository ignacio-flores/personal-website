    - id: income-indicators
      image: images/research/dominican-republic/option-2.png
      format: square
      alt: "Six charts compare average income, population, and inequality indicators from multiple Dominican data sources."
      caption: "Distributional indicators across statistical sources."
    - id: adjustment-stages
      image: images/research/dominican-republic/option-3.png
      format: square
      alt: "Six charts trace inequality estimates through successive adjustments from household surveys to distributional national accounts."
      caption: "How each integration step changes measured inequality."

chile-tax-reform:
  selected: income-tax-rates
  source:
    label: Ministry of Finance report
    url: pdf/nota-reforma-tributaria-chl-2022.pdf
  options:
    - id: income-composition
      image: images/research/chile-tax-reform/option-1.png
      format: square
      alt: "Four charts show average annual income and income composition by percentile in Chile."
      caption: "Average income and its composition across the distribution."
    - id: income-tax-rates
      image: images/research/chile-tax-reform/option-2.png
      format: square
      alt: "Horizontal bars show effective income-tax rates across the full distribution and within the top one percent and top 0.1 percent."
      caption: "Effective income-tax rates across Chile's income distribution."
    - id: combined-tax-rates
      image: images/research/chile-tax-reform/option-3.png
      format: square
      alt: "Horizontal bars compare effective income and consumption tax rates from the bottom half through the top 0.01 percent."
      caption: "Combined effective income and consumption tax rates."

dina-latin-america:
  selected: top-shares
  source:
    label: WID.world technical note
    url: https://wid.world/document/income-inequality-series-for-latin-america-world-inequality-lab-technical-note-2020-02/
  options:
    - id: survey-national-income
      image: images/research/dina-latin-america/option-1.png
      format: portrait
      alt: "Country panels compare Gini coefficients from household surveys with estimates scaled to national income."
      caption: "From household-survey income to national income across Latin America."
    - id: gini-steps
      image: images/research/dina-latin-america/option-2.png
      format: portrait
      alt: "Country panels show Gini coefficients at three successive stages of the distributional national accounts method."
      caption: "Gini coefficients through three integration steps."
    - id: top-shares
      image: images/research/dina-latin-america/option-3.png
      format: portrait
      alt: "Country panels show top ten percent income shares at three successive stages of the distributional national accounts method."
      caption: "Top 10% income shares through three integration steps."

dina-guidelines:
  selected: merging-point
  source:
    label: WID.world guidelines
    url: https://wid.world/www-site/uploads/2020/09/WorldInequalityLab_DINA_Guidelines_2020.pdf
  options:
    - id: distributions
      image: images/research/dina-guidelines/option-1.png
      format: square
      alt: "A diagram compares hypothetical income distributions in survey and tax data and marks their divergence in the upper tail."
      caption: "Hypothetical income distributions in survey and tax data."
    - id: merging-point
      image: images/research/dina-guidelines/option-2.png
      format: square
      alt: "Two diagrams illustrate how survey and tax distributions are joined at an estimated merging point."
      caption: "Choosing a merging point between survey and tax data."
    - id: survey-shape
      image: images/research/dina-guidelines/option-3.png
      format: square
      alt: "A chart compares the shape of household-survey income distributions in France and the United States across percentiles."
      caption: "Differences in survey income distributions across countries."
