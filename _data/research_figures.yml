# Each research item has three prepared figure options. Change only `selected`
# to one of the option IDs in the same set; format controls its display width.

land-inequality:
  selected: temperature
  source:
    label: Working paper
    url: pdf/land-inequality-from-space.pdf
  options:
    - id: productivity
      image: images/research/land-inequality/option-1.png
      format: wide
      alt: "Two panels compare weekly crop productivity with land inequality, using all weeks and the May-to-September growing season."
      caption: "Crop productivity and land inequality across French regions."
    - id: temperature
      image: images/research/land-inequality/option-2.png
      format: wide
      alt: "Crop productivity rises with temperature and then falls after about 30 degrees Celsius, with steeper losses in areas with higher land inequality."
      caption: "Weekly crop productivity and temperature across land-inequality quartiles."
    - id: mechanisms
      image: images/research/land-inequality/option-3.png
      format: square
      alt: "A grid of estimates compares heat exposure, seminatural land, and farm structure across several ecological indicators."
      caption: "Potential mechanisms linking land concentration to heat vulnerability."

housing-pensions:
  selected: adjusted-shares
  source:
    label: Working paper
    url: pdf/from-housing-gains.pdf
  options:
    - id: wealth-composition
      image: images/research/housing-pensions/option-1.png
      format: wide
      alt: "Stacked areas show the changing composition of Chilean household wealth, alongside private wealth relative to national income."
      caption: "Private wealth, its composition, and national income in Chile."
    - id: adjusted-shares
      image: images/research/housing-pensions/option-2.png
      format: square
      alt: "Three panels compare top wealth shares before and after integrating administrative pension balances into survey data."
      caption: "Top wealth shares after micro-macro integration."
    - id: growth-incidence
      image: images/research/housing-pensions/option-3.png
      format: wide
      alt: "Four line charts show wealth growth by percentile across successive periods from 2007 to 2021."
      caption: "Wealth growth across the distribution, 2007–2021."

gc-wealth:
  selected: source-comparison
  source:
    label: Scientific Data article
    url: https://www.nature.com/articles/s41597-026-07105-6
  options:
    - id: source-comparison
      image: images/research/gc-wealth/option-1.png
      format: square
      alt: "Small-multiple country charts compare top wealth shares reported by household surveys, tax records, rich lists, and distributional accounts."
      caption: "How wealth-share estimates vary by source across countries."
    - id: gcw-comparison
      image: images/research/gc-wealth/option-2.png
      format: wide
      alt: "Country panels compare the Wealth Inequality Project series with other leading wealth-inequality databases."
      caption: "Wealth Inequality Project estimates against alternative data series."
    - id: country-detail
      image: images/research/gc-wealth/option-3.png
      format: portrait
      alt: "Two country panels show top wealth shares from multiple data sources over time."
      caption: "A compact country-level view of wealth-share evidence."

income-data-gaps:
  selected: inequality-comparison
  source:
    label: Article
    url: https://doi.org/10.31389/eco.418
  options:
    - id: inequality-comparison
      image: images/research/income-data-gaps/option-1.png
      format: square
      alt: "Four panels compare top ten percent income shares and Gini coefficients using survey income and national income."
      caption: "Inequality measured with survey income and national income."
    - id: source-totals
      image: images/research/income-data-gaps/option-2.png
      format: square
      alt: "Country panels compare total income recorded in national accounts, household surveys, and administrative data."
      caption: "The income totals captured by different statistical sources."
    - id: gap-decomposition
      image: images/research/income-data-gaps/option-3.png
      format: square
      alt: "Country panels decompose the gap between survey income and national income into labor, capital, and mixed-income components."
      caption: "Decomposing the survey–national income gap."

wealth-latin-america:
  selected: top-shares
  source:
    label: Open-access article
    url: https://ora.ox.ac.uk/objects/uuid:35cf4831-5713-43b7-bcdf-0856b91d72ce
  options:
    - id: wealth-income
      image: images/research/wealth-latin-america/option-1.png
      format: square
      alt: "A line chart compares private net wealth relative to national income in Brazil, Chile, Mexico, and Uruguay."
      caption: "Private net wealth relative to national income, 2002–2020."
    - id: top-shares
      image: images/research/wealth-latin-america/option-2.png
      format: square
      alt: "Three panels compare adjusted top one percent wealth shares with benchmark administrative and survey estimates."
      caption: "Adjusted top 1% wealth shares across Latin America."
    - id: percentile-profiles
      image: images/research/wealth-latin-america/option-3.png
      format: wide
      alt: "Net-worth profiles by percentile compare Chile, Colombia, Mexico, and Uruguay for the middle forty percent and bottom fifty percent."
      caption: "Wealth profiles across the middle and bottom of the distribution."

businesses-inequality:
  selected: business-size
  source:
    label: Open-access article
    url: https://discovery.ucl.ac.uk/id/eprint/10200435/
  options:
    - id: business-size
      image: images/research/businesses-inequality/option-1.png
      format: wide
      alt: "Two circular charts compare employment by business size in Latin America and the European Union."
      caption: "Employment weights by business size in Latin America and Europe."
    - id: establishment-growth
      image: images/research/businesses-inequality/option-2.png
      format: square
      alt: "A line chart compares establishment growth in Colombia, Brazil, Mexico, India, and the United States."
      caption: "Employment growth across establishments of different ages."
    - id: personal-income
      image: images/research/businesses-inequality/option-3.png
      format: square
      alt: "A line chart compares personal income growth in Latin America with the United States and the European Union."
      caption: "Long-run personal income growth across regions."

latin-american-exception:
  selected: growth-incidence
  source:
    label: Working paper
    url: pdf/more-unequal-or-not-as-rich.pdf
  options:
    - id: inequality-distribution
      image: images/research/latin-american-exception/option-1.png
      format: portrait
      alt: "Country panels trace Gini coefficients from household surveys, corrected surveys, and distributional national accounts."
      caption: "Inequality trends under alternative income concepts."
    - id: growth-incidence
      image: images/research/latin-american-exception/option-2.png
      format: portrait
      alt: "Country panels show percentile-level income growth, comparing survey estimates with corrected and national-income estimates."
      caption: "How measured growth is distributed across income percentiles."
    - id: taxes-transfers
      image: images/research/latin-american-exception/option-3.png
      format: portrait
      alt: "Country panels decompose national income into labor, capital, taxes, transfers, and public spending across groups."
      caption: "The composition of income before and after redistribution."

weight-of-the-rich:
  selected: calibration-results
  source:
    label: Working paper and appendix
    url: https://wid.world/document/the-weight-of-the-rich-improving-surveys-using-tax-data-wid-world-working-paper-2018-12/
  options:
    - id: calibration-results
      image: images/research/weight-of-the-rich/option-1.png
      format: square
      alt: "Density plots compare benchmark income distributions with calibrated survey results for several estimators."
      caption: "Benchmark performance of alternative top-income corrections."
    - id: merging-point
      image: images/research/weight-of-the-rich/option-2.png
      format: square
      alt: "Density and error plots illustrate how the method selects a merging point between survey and tax data."
      caption: "Selecting the point at which survey and tax data are merged."
    - id: country-results
      image: images/research/weight-of-the-rich/option-3.png
      format: square
      alt: "Country charts compare uncorrected and corrected top one percent income shares over time."
      caption: "Top-income shares before and after survey correction."

capital-share:
  selected: sector-shares
  source:
    label: Article
    url: https://link.springer.com/article/10.1007/s10888-021-09482-x
  options:
    - id: sector-shares
      image: images/research/capital-share/option-1.png
      format: portrait
      alt: "Four line charts show capital shares for the household, corporate, public, and private-corporation sectors over time."
      caption: "Capital shares by institutional sector."
    - id: long-run-comparison
      image: images/research/capital-share/option-2.png
      format: square
      alt: "Country panels compare capital shares in national accounts, tax data, and household surveys over the long run."
      caption: "Capital-income coverage in micro and macro data."
    - id: measurement-error
      image: images/research/capital-share/option-3.png
      format: wide
      alt: "Two panels illustrate how unequal undermeasurement of labor and capital income changes inequality estimates."
      caption: "How survey measurement error changes income inequality."

top-incomes-chile:
  selected: undistributed-profits
  source:
    label: Working paper
    url: pdf/top-incomes-chile-roiw.pdf
  options:
    - id: fiscal-shares
      image: images/research/top-incomes-chile/option-1.png
      format: square
      alt: "Two charts trace the top one percent, top 0.1 percent, and top 10 percent fiscal income shares in Chile since 1964."
      caption: "Fiscal top-income shares in Chile, 1964–2017."
    - id: undistributed-profits
      image: images/research/top-incomes-chile/option-2.png
      format: wide
      alt: "A chart compares top income shares before and after allocating undistributed corporate profits."
      caption: "Top-income shares including undistributed profits."
    - id: real-growth
      image: images/research/top-incomes-chile/option-3.png
      format: square
      alt: "Two charts compare real income growth for high-income and lower-income groups across political periods in Chile."
      caption: "Real income growth at the top and across the rest of the distribution."

wealth-chile-chapter:
  selected: wealth-composition
  source:
    label: Companion Ministry of Finance report
    url: pdf/nota-reforma-tributaria-chl-2022.pdf
  options:
    - id: wealth-composition
      image: images/research/wealth-chile-chapter/option-1.png
      format: square
      alt: "Charts show average net wealth and its composition by wealth percentile in Chile."
      caption: "Companion figure: average wealth and portfolio composition across Chilean households."
    - id: wealth-tax
      image: images/research/wealth-chile-chapter/option-2.png
      format: square
      alt: "A curve shows the effective wealth-tax burden across the upper tail of Chile's wealth distribution."
      caption: "Companion figure: effective burden of a proposed wealth tax."
    - id: reform-scenarios
      image: images/research/wealth-chile-chapter/option-3.png
      format: square
      alt: "Horizontal bars compare effective income-tax rates before and after a proposed reform for the top one percent, top 0.1 percent, and top 0.01 percent."
      caption: "Companion figure: tax rates before and after the proposed reform."

growth-distribution-chile:
  selected: taxes-transfers
  source:
    label: Companion working paper
    url: pdf/more-unequal-or-not-as-rich.pdf
  options:
    - id: inequality-series
      image: images/research/growth-distribution-chile/option-1.png
      format: portrait
      alt: "Country panels, including Chile, compare inequality trends from surveys with corrected and national-income estimates."
      caption: "Companion figure: Chile in a regional comparison of inequality trends."
    - id: growth-incidence
      image: images/research/growth-distribution-chile/option-2.png
      format: portrait
      alt: "Country panels, including Chile, compare survey and national-income growth across percentiles."
      caption: "Companion figure: distributional growth in Chile and its regional peers."
    - id: taxes-transfers
      image: images/research/growth-distribution-chile/option-3.png
      format: portrait
      alt: "Country panels, including Chile, show the distribution of market income, taxes, transfers, and public spending."
      caption: "Companion figure: the distribution before and after taxes and transfers."

cepal-integration:
  selected: source-coverage
  source:
    label: CEPAL report
    url: https://repositorio.cepal.org/server/api/core/bitstreams/73bea31d-782d-42f2-a086-a1cb8863c148/content
  options:
