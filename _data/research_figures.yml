      image: images/research/cepal-integration/option-1.png
      format: square
      alt: "Country panels compare total income captured by household surveys and administrative sources relative to national accounts."
      caption: "Income coverage across surveys, administrative data, and national accounts."
    - id: income-gap
      image: images/research/cepal-integration/option-2.png
      format: wide
      alt: "Country panels decompose the gap between survey income and national income by income component."
      caption: "Decomposing the gap between survey and national income."
    - id: component-series
      image: images/research/cepal-integration/option-3.png
      format: square
      alt: "A grid of country charts shows discrepancies between statistical sources for wages, capital income, mixed income, and transfers."
      caption: "Source discrepancies by country and income component."

dominican-republic:
  selected: adjustment-stages
  source:
    label: CEPAL report
    url: https://repositorio.cepal.org/server/api/core/bitstreams/1a41a90a-7ce7-4071-bb6c-e5b59cbf5009/content
  options:
    - id: tax-survey
      image: images/research/dominican-republic/option-1.png
      format: wide
      alt: "Two line charts compare the top one percent income share in household-survey and tax data for the Dominican Republic."
