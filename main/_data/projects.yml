- section: Data infrastructure and public tools
  title: WID.world
  url: https://wid.world
  role: World Inequality Database
  description: Open, comparable data on income and wealth distribution worldwide. I oversee statistical methods across regions and produce and update inequality statistics for Latin America and the Caribbean.
  links:
    - label: Visit WID.world
      url: https://wid.world

- section: Data infrastructure and public tools
  title: Wealth Inequality Project
  url: https://wealthinequalityproject.org/
  role: Stone Center
  description: Public encyclopedia on wealth, wealth inequality, wealth transfers, and tax policies. My contributions include data architecture, web design, and visualisation tools.
  links:
    - label: Visit the project
      url: https://wealthinequalityproject.org/

- section: Data infrastructure and public tools
  title: distribuciones.info
  url: https://distribuciones.info
  role: Website (in Spanish)
  description: A public website for exploring the distribution of economic growth in Latin America, with documentation and data downloads (With Mauricio De Rosa and Marc Morgan).
  links:
    - label: Explore the website
      url: https://distribuciones.info
    - label: Source code
      url: https://github.com/ignacio-flores/distribuciones-website

